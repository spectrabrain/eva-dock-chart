{{- $hasInlineSecrets := or .Values.secrets.dockAccessPassword .Values.secrets.evaMysqlUser .Values.secrets.evaMysqlPassword -}}
{{- if $hasInlineSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eva-dock.secretName" . }}
  labels:
    {{- include "eva-dock.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.dockAccessPassword }}
  DOCK_ACCESS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.evaMysqlUser }}
  EVA_MYSQL_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.evaMysqlPassword }}
  EVA_MYSQL_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
