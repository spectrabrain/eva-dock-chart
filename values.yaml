replicaCount: 1

image:
  repository: 211722900905.dkr.ecr.ap-northeast-2.amazonaws.com/spectrabrain/eva-dock
  tag: "3.3.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 80

# Leave disabled when the cluster already has an Ingress for this host.
# Route that Ingress to this chart's Service on port 80.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: "dock.example.com"
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# SQLite, alert history, camera catalog, and EVA registry are stored under /data.
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# These values create a Kubernetes Secret for the Dock container. Alternatively,
# reference a pre-created Secret with existingSecret.
secrets:
  existingSecret: ""
  dockAccessPassword: ""
  evaMysqlUser: ""
  evaMysqlPassword: ""

config:
  verifyTls: false
  dashboardFeedbackFallbackSource: api
  dashboardAnalysisPollSec: 180
  dashboardAnalysisOverlapSec: 240
  dashboardAnalysisMaxGapSec: 600
  evaMysqlPort: 3306
  evaMysqlDatabase: eva
  ingestStaleSec: 3600
  dashboardEnabled: true
  liveEnabled: false
  streamingEnabled: false
  feedMax: 50
  dockAuthTokenTtlSec: 1800
  dockPublicUrl: ""
  livePerEva: 16
  streamIdleTimeoutSec: 20

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
